name: 'Check POV-Ray CLI for Windows'
description: 'Run build check step for POV-Ray CLI for Windows'

inputs:
  solution:
    description: 'subdirectory of `windows` in which `povray.sln` is located'
    default: 'vs2015'
    required: false
  version-base:
    description: 'VERSION_BASE value'
    required: true
  platform:
    description: 'Solution platform to build - x64, Win32, ARM64'
    required: false
    default: 'x64'
  vcvarsver:
    description: 'Microsoft C++ runtime library version'
    required: false
    default: 14.4
  mscversion:
    description: 'Microsoft C++ compiler version'
    required: false
    default: 1944
  check-output:
    description: 'check output file with path'
    required: false
    default: 'tests\space in dir name test\biscuit space in file name test'
  check-pov-file:
    description: 'check pov input file'
    required: false
    default: 'tests\space in dir name test\biscuit.pov'
  check-parameters:
    description: 'image render parameters'
    required: false
    default: '-d -p +a0.3 +UA +A +w320 +h240'
  check-includes:
    description: 'paths to include ini files'
    required: false
    default: '+L"..\..\distribution\ini" +L"..\..\distribution\include" +L"..\..\distribution\scenes"'

runs:
  using: composite
  steps:
  - shell: cmd
    run: |
      IF /I ${{ inputs.platform }} EQU ARM64 (
        @ECHO OFF &SETLOCAL
        ECHO Skipping build check on ARM64 platform. && EXIT 0
        IF EXIST "%LIBPATH%" (
          ECHO ARM64 environment variables already set.
        ) ELSE (
          PUSHD "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build"
          vcvarsamd64_arm64.bat -vcvars_ver=${{ inputs.vcvarsver }}
          ECHO.${{ inputs.mscversion }} > %TEMP%\settings.c
          cl.exe -Bv -EP %TEMP%\settings.c >NUL
          POPD
        )
      ) ELSE (
        @ECHO OFF &SETLOCAL
      )
      SET PL=64
      SET PACKAGE=lpub3d_trace_cui
      SET POV_IGNORE_SYSCONF_MSG=yes
      SET PLATFORM=${{ inputs.platform }}
      SET VERSION_BASE=${{ inputs.version-base }}
      SET SOLUTION_PATH=windows/${{ inputs.solution }}/
      SET BUILD_CHK_OUTPUT=${{ inputs.check-output }}
      SET BUILD_CHK_POV_FILE=${{ inputs.check-pov-file }}
      SET BUILD_CHK_PARAMS=${{ inputs.check-parameters }}
      SET BUILD_CHK_INCLUDE=${{ inputs.check-includes }}
      IF %PLATFORM% EQU Win32 SET PL=32
      IF EXIST "%BUILD_CHK_OUTPUT%" DEL /Q "%BUILD_CHK_OUTPUT%"
      SET CONFIG_DIR=%USERPROFILE%\AppData\Local\LPub3D Software\LPub3D\3rdParty\%PACKAGE%-%VERSION_BASE%\config
      IF NOT EXIST "%CONFIG_DIR%\" MKDIR "%CONFIG_DIR%\"
      CD %SOLUTION_PATH%
      ECHO Create %CONFIG_DIR%\povray.conf...
      COPY /V /Y "..\..\distribution\povray.conf" "%CONFIG_DIR%\povray.conf" /A
      SET genConfigFile="%CONFIG_DIR%\povray.conf" ECHO
      :GENERATE build check povray.conf settings file - append read+write settings
      >>%genConfigFile%.
      >>%genConfigFile% ; LPub3D-Trace-CUI build check conf settings
      >>%genConfigFile%.
      >>%genConfigFile% read* = "%CONFIG_DIR%"
      >>%genConfigFile%.
      >>%genConfigFile% ; LPub3D-Trace-CUI is called from (%CD%).
      >>%genConfigFile% read* = "..\..\distribution\ini"
      >>%genConfigFile% read* = "..\..\distribution\include"
      >>%genConfigFile% read* = "..\..\distribution\scenes"
      >>%genConfigFile% read+write* = ".\tests\space in dir name test"
      ECHO Create %CONFIG_DIR%\povray.ini...
      COPY /V /Y "..\..\distribution\ini\povray.ini" "%CONFIG_DIR%\povray.ini" /A
      SET genConfigFile="%CONFIG_DIR%\povray.ini" ECHO
      :GENERATE build check povray.ini settings file - append output settings
      >>%genConfigFile%.
      >>%genConfigFile% ; LPub3D-Trace-CUI build check ini settings
      >>%genConfigFile%.
      >>%genConfigFile% Output_to_File=true
      >>%genConfigFile% Output_File_Type=N8             ; (+/-Ftype)
      SET BUILD_CHK_COMMAND=+I"%BUILD_CHK_POV_FILE%" +O"%BUILD_CHK_OUTPUT%.%PL%bit.png" %BUILD_CHK_PARAMS% %BUILD_CHK_INCLUDE%
      ECHO BUILD_CHECK_COMMAND......[%PACKAGE%%PL%.exe %BUILD_CHK_COMMAND%]
      bin%PL%\%PACKAGE%%PL%.exe %BUILD_CHK_COMMAND%
      ENDLOCAL
